<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />

    <!--
      Link preview tags. Crawlers do not run JavaScript, so these must be static.
      Keep the text in sync with `common.head.appName` and `common.head.login.*`.
      `RootComponent` removes the `data-static-head` tags once `HeadContent` renders its own.
      On `/voting/proposals/<id>`, the backend writes the proposal into the title, description,
      og:title, og:description, og:url, twitter:title, and twitter:description tags.
      It also adds twitter:label and twitter:data tags after twitter:image:alt.
    -->
    <title data-static-head>ICP governance &amp; voting | Network Nervous System</title>
    <meta
      data-static-head
      name="description"
      content="Participate in decentralized governance on the Internet Computer. Lock ICP, vote on proposals, and mint rewards."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Network Nervous System" />
    <meta property="og:title" content="ICP governance &amp; voting | Network Nervous System" />
    <meta
      property="og:description"
      content="Participate in decentralized governance on the Internet Computer. Lock ICP, vote on proposals, and mint rewards."
    />
    <meta property="og:url" content="https://nns.icp.net/" />
    <meta property="og:image" content="https://nns.icp.net/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Network Nervous System" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ICP governance &amp; voting | Network Nervous System" />
    <meta
      name="twitter:description"
      content="Participate in decentralized governance on the Internet Computer. Lock ICP, vote on proposals, and mint rewards."
    />
    <meta name="twitter:image" content="https://nns.icp.net/og-image.jpg" />
    <meta name="twitter:image:alt" content="Network Nervous System" />

    <!-- Favicon (colored infinity mark, reads on both light and dark) -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />

    <!-- Preload critical self-hosted fonts (UI + hero title) -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#faf9f5" />

    <!-- Sets the theme and picks the static frame. The CSP blocks inline scripts. -->
    <script src="/startup-v1.js"></script>

    <!-- Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Network Nervous System" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Network Nervous System" />

    <!-- Prevent telephone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Styles of the static frame in `body`. -->
    <style>
      [data-startup='app'],
      [data-nav-item='accounts'] {
        display: none;
      }
      html[data-session] [data-startup='login'] {
        display: none;
      }
      html[data-session] [data-startup='app'],
      html[data-accounts] [data-nav-item='accounts'] {
        display: flex;
      }
      html[data-nav='dashboard'] [data-nav-item='dashboard'],
      html[data-nav='accounts'] [data-nav-item='accounts'],
      html[data-nav='neurons'] [data-nav-item='neurons'],
      html[data-nav='voting'] [data-nav-item='voting'],
      html[data-nav='settings'] [data-nav-item='settings'] {
        --startup-active-bar: var(--primary);
        --startup-active-row: color-mix(in oklab, var(--primary) 10%, transparent);
        color: var(--primary);
      }
      aside [data-nav-item] {
        background: var(--startup-active-row);
      }
      aside [data-nav-item]::before {
        content: '';
        position: absolute;
        left: 0;
        width: 3px;
        height: 1.5rem;
        border-radius: 9999px;
        background: var(--startup-active-bar);
      }
      @media (max-width: 1023px) {
        html[data-detail] [data-startup-bottom] {
          display: none;
        }
      }
    </style>
  </head>

    -->

          ></div>

            <div
              data-nav-item="voting"
              class="relative flex items-center gap-3 rounded-md px-4 py-3 text-foreground-secondary"
            >
              <svg class="size-5"><use href="#startup-voting" /></svg
              ><span>Vote for proposals</span>
            </div>
            <div
              data-nav-item="settings"
              class="relative flex items-center gap-3 rounded-md px-4 py-3 text-foreground-secondary"
            >
              <svg class="size-5"><use href="#startup-settings" /></svg><span>Settings</span>
            </div>
          </div>
          <div class="border-t p-3"><div class="h-12"></div></div>
        </aside>
        <div class="flex h-full w-full flex-col overflow-hidden">
          <div class="relative flex-1 bg-main-content"></div>
          <div
            data-startup-bottom
            class="z-50 shrink-0 border-t bg-background/95 pb-[env(safe-area-inset-bottom)] backdrop-blur-sm lg:hidden"
          >
            <div class="flex h-13 w-full">
              <div
                data-nav-item="dashboard"
                class="flex w-full flex-col items-center justify-center text-foreground-secondary"
              >
                <svg class="size-6"><use href="#startup-dashboard" /></svg>
              </div>
              <div
                data-nav-item="accounts"
                class="flex w-full flex-col items-center justify-center text-foreground-secondary"
              >
                <svg class="size-6"><use href="#startup-accounts" /></svg>
              </div>
              <div
                data-nav-item="neurons"
                class="flex w-full flex-col items-center justify-center text-foreground-secondary"
              >
                <svg class="size-6"><use href="#startup-neurons" /></svg>
              </div>
              <div
                data-nav-item="voting"
                class="flex w-full flex-col items-center justify-center text-foreground-secondary"
              >
                <svg class="size-6"><use href="#startup-voting" /></svg>
              </div>
              <div
                data-nav-item="settings"
                class="flex w-full flex-col items-center justify-center text-foreground-secondary"
              >
                <svg class="size-6"><use href="#startup-settings" /></svg>
              </div>
            </div>
          </div>
        </div>

    <div id="root"></div>
    <div id="notifications"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
