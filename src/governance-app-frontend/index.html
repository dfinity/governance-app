<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />

    <!--
      Link preview tags. Crawlers do not run JavaScript, so these must be static.
      Keep the text in sync with `common.head.appName` and `common.head.login.*`.
      `RootComponent` removes the `data-static-head` tags once `HeadContent` renders its own.
      On `/voting/proposals/<id>`, the backend writes the proposal into the title, description,
      og:title, og:description, og:url, twitter:title, and twitter:description tags.
    -->
    <title data-static-head>ICP governance &amp; voting | Network Nervous System</title>
    <meta
      data-static-head
      name="description"
      content="Participate in decentralized governance on the Internet Computer. Lock ICP, vote on proposals, and mint rewards."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Network Nervous System" />
    <meta property="og:title" content="ICP governance &amp; voting | Network Nervous System" />
    <meta
      property="og:description"
      content="Participate in decentralized governance on the Internet Computer. Lock ICP, vote on proposals, and mint rewards."
    />
    <meta property="og:url" content="https://nns.internetcomputer.org/" />
    <meta property="og:image" content="https://nns.internetcomputer.org/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Internet Computer Governance" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ICP governance &amp; voting | Network Nervous System" />
    <meta
      name="twitter:description"
      content="Participate in decentralized governance on the Internet Computer. Lock ICP, vote on proposals, and mint rewards."
    />
    <meta name="twitter:image" content="https://nns.internetcomputer.org/og-image.jpg" />
    <meta name="twitter:image:alt" content="Internet Computer Governance" />

    <!-- Favicon (colored infinity mark, reads on both light and dark) -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />

    <!-- Preload critical self-hosted fonts (UI + hero title) -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#faf9f5" />

    <!-- Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Network Nervous System" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Network Nervous System" />

    <!-- Prevent telephone number detection -->
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <div id="notifications"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
