name: Pipeline E2E
on:
  workflow_call:

jobs:
  tests:
    name: E2E Tests (${{ matrix.project }})
    timeout-minutes: 30
    runs-on: dind-small
    # Sharded per Playwright project: each project gets its own runner and its own replica, so
    # the two no longer queue behind each other on a single machine.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile]
    # NOTE: NOT using the GitHub Actions `container:` directive, but instead running docker "manually"
    # This fixes Playwright connectivity issues found in GitHub Actions default containers
    env:
      BASE_URL: http://mc7vh-sqaaa-aaaai-q33na-cai.localhost:8080
      CONTAINER_IMAGE: ghcr.io/dfinity/governance-app/builder-base:0.0.10
      # Cache dirs live inside the workspace so they are visible both to actions/cache on the
      # host and to the tooling running inside the mounted container.
      NPM_CACHE_DIR: .ci-cache/npm
      CARGO_HOME_DIR: .ci-cache/cargo
      PLAYWRIGHT_BROWSERS_DIR: .ci-cache/playwright

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore npm cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NPM_CACHE_DIR }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Restore cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.CARGO_HOME_DIR }}
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Restore Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_DIR }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Pull container image
        run: docker pull $CONTAINER_IMAGE

      - name: Run E2E tests in Docker container
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e BASE_URL="$BASE_URL" \
            -e CI=true \
            -e PROJECT="${{ matrix.project }}" \
            -e npm_config_cache="/app/$NPM_CACHE_DIR" \
            -e CARGO_HOME="/app/$CARGO_HOME_DIR" \
            -e PLAYWRIGHT_BROWSERS_PATH="/app/$PLAYWRIGHT_BROWSERS_DIR" \
            $CONTAINER_IMAGE \
            bash -c '
              set -e
              echo "=== Container Environment ==="
              echo "Hostname: $(hostname)"
              echo "User: $(whoami)"
              echo "Node: $(node -v)"
              echo "DFX: $(dfx --version)"
              echo "Project: $PROJECT"
              echo ""

              echo "=== Installing dependencies ==="
              npm ci

              echo "=== Generating .env file ==="
              ./scripts/config.sh -n local

              echo "=== Starting local dfx replica ==="
              ./scripts/start-pocket-ic.sh --background --delay 0

              echo "=== Waiting for server ==="
              max_attempts=30
              for i in $(seq 1 $max_attempts); do
                if curl -s -i $BASE_URL | grep -q "200 OK"; then
                  echo "Server is up!"
                  break
                fi
                echo "Server not ready yet... attempt $i/$max_attempts"
                sleep 2
                if [ "$i" -eq "$max_attempts" ]; then
                  echo "Server did not become ready after $max_attempts attempts, exiting."
                  exit 1
                fi
              done

              echo ""
              echo "=== Installing Playwright browsers ==="
              npx playwright install --with-deps chromium

              echo ""
              echo "=== Running E2E tests (updating snapshots) ==="
              cd src/governance-app-frontend
              npx playwright test --project="$PROJECT" --update-snapshots --reporter=list,html

              echo ""
              echo "=== Stopping dfx ==="
              dfx stop
            '

      - name: Collect changed/new screenshots
        id: collect_snaps
        shell: bash
        run: |
          set -euo pipefail
          SNAP_DIR="src/governance-app-frontend/tests/e2e/snapshots"

          # Modified tracked PNGs (vs checked-out ref)
          mapfile -t MOD < <(git diff --name-only -- "$SNAP_DIR" | grep -E '\.png$' || true)
          # New (untracked) PNGs
          mapfile -t NEW < <(git ls-files --others --exclude-standard -- "$SNAP_DIR" | grep -E '\.png$' || true)

          ALL=("${MOD[@]}" "${NEW[@]}")
          if [ "${#ALL[@]}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes."
            exit 0
          fi

          # newline-separated file list for upload-artifact
          {
            echo 'files<<__EOF__'
            printf '%s\n' "${ALL[@]}" | sort -u
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # Summary update
          {
            echo "### Snapshot updates"
            echo "Run \`./scripts/update-snapshots.sh\` to update snapshots locally."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload updated snapshots
        if: ${{ steps.collect_snaps.outputs.has_changes == 'true' && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updated-snapshots-${{ matrix.project }}
          path: ${{ steps.collect_snaps.outputs.files }}
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: src/governance-app-frontend/playwright-report/
          retention-days: 30

      - name: Snapshots changed. Run ./scripts/update-snapshots.sh to update.
        if: steps.collect_snaps.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          echo "::error:: Snapshots have changed. Please run ./scripts/update-snapshots.sh locally and commit the updated PNG files."
          exit 1
